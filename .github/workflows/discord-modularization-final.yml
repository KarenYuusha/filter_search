name: Discord modularization final verifier

on:
  pull_request:
    branches: [refactor/discord-modularization]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - run: python -m compileall -q toram_data toram_search toram_discord search_items.py discord_bot.py
      - run: python -m unittest tests.test_discord_module_boundaries -v
      - run: python -m unittest discover -s tests -v
