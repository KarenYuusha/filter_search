name: Core modularization Task 5 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify parser module is missing
        run: |
          python - <<'PY'
          import search_items
          from toram_search import parser as parser_module
          assert search_items.ParsedSearch is parser_module.ParsedSearch
          assert search_items.parse_search_query is parser_module.parse_search_query
          PY
