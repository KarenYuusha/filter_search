name: Core modularization Task 6 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify routing module is missing
        run: |
          python - <<'PY'
          import search_items
          from toram_search.routing import DeterministicRoute, route_deterministically
          assert search_items.DeterministicRoute is DeterministicRoute
          assert search_items.route_deterministically is route_deterministically
          PY
