name: Core modularization Task 7 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify package does not depend on CLI
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          offenders = []
          for package in ('toram_data', 'toram_search'):
              for path in sorted(Path(package).glob('*.py')):
                  tree = ast.parse(path.read_text(), filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          if any(alias.name == 'search_items' for alias in node.names):
                              offenders.append(str(path))
                      elif isinstance(node, ast.ImportFrom) and node.module == 'search_items':
                          offenders.append(str(path))
          assert not offenders, offenders
          PY
