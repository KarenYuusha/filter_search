name: Core modularization Task 4 final verify
on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Compile
        run: python -m py_compile toram_search/ranking.py search_items.py
      - name: Focused tests
        run: python -m unittest tests.test_item_search_relevance tests.test_core_module_boundaries -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
