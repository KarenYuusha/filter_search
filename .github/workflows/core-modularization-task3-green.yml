name: Core modularization Task 3 GREEN
on:
  pull_request:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
          path: feature
      - uses: actions/checkout@v4
        with:
          ref: verify/core-modularization-task1
          path: verifier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Apply Task 3
        working-directory: feature
        run: python ../verifier/.github/scripts/task3_patch.py
      - name: Compile
        working-directory: feature
        run: python -m py_compile toram_data/search_models.py toram_data/search_repository.py search_items.py
      - name: Focused tests
        working-directory: feature
        run: python -m unittest tests.test_core_module_boundaries tests.test_search_service tests.test_item_search_relevance -v
      - name: Real database smoke
        working-directory: feature
        run: |
          python - <<'PY'
          from pathlib import Path
          from toram_data.search_repository import ItemRepository

          repo = ItemRepository(Path('coryn_data/database/items.sqlite'))
          try:
              assert repo.list_items()
              assert 'Usable' in repo.list_item_types()
              assert repo.list_stat_names()
          finally:
              repo.close()
          print('repository smoke: OK')
          PY
      - name: Full suite
        working-directory: feature
        run: python -m unittest discover -s tests -v
      - name: Commit Task 3
        working-directory: feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_data/search_models.py toram_data/search_repository.py search_items.py tests/test_core_module_boundaries.py
          git commit -m "refactor: extract item repository and domain models"
          git push origin HEAD:refactor/core-search-modularization
