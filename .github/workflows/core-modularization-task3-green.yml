name: Core modularization Task 4 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify ranking module is missing
        run: |
          python - <<'PY'
          import search_items
          from toram_search.ranking import RankedItem, rank_items
          assert search_items.RankedItem is RankedItem
          assert search_items.rank_items is rank_items
          PY
