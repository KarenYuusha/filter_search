name: Core modularization Task 6 GREEN
on:
  pull_request:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
          path: feature
      - uses: actions/checkout@v4
        with:
          ref: verify/core-modularization-task1
          path: verifier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Apply Task 6
        working-directory: feature
        run: python ../verifier/.github/scripts/task6_patch.py
      - name: Compile
        working-directory: feature
        run: python -m py_compile toram_search/routing.py search_items.py toram_search/service.py
      - name: Focused tests
        working-directory: feature
        run: |
          python -m unittest \
            tests.test_core_module_boundaries \
            tests.test_direct_structured_intent \
            tests.test_search_service \
            tests.test_item_query_understanding \
            tests.test_query_reconstruction \
            -v
      - name: Full suite
        working-directory: feature
        run: python -m unittest discover -s tests -v
      - name: Commit Task 6
        working-directory: feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_search/routing.py toram_search/service.py search_items.py tests/test_core_module_boundaries.py
          git commit -m "refactor: extract deterministic search routing"
          git push origin HEAD:refactor/core-search-modularization
