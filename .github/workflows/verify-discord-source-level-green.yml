name: Verify Discord Source Level GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin fix/discord-source-level-dedup
          git checkout -B fix/discord-source-level-dedup origin/fix/discord-source-level-dedup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow level-dedup fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('discord_bot.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if source.get("level") is not None:
                      details.append(f"Lv {source['level']}")
          '''
          new = '''        level = source.get("level")
                  if level is not None:
                      level_text = _format_number(level)
                      level_pattern = rf"\\blv\\.?\\s*{re.escape(level_text)}(?:\\b|(?=\\)))"
                      if re.search(level_pattern, source_name, flags=re.IGNORECASE) is None:
                          details.append(f"Lv {level_text}")
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one formatter block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile
        run: python -m py_compile discord_bot.py search_items.py toram_search/service.py
      - name: Run focused regressions
        run: python -m unittest tests.test_discord_source_display tests.test_discord_bot tests.test_discord_image_paths -v
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord_bot.py
          git commit -m "fix: deduplicate source levels in Discord details"
          git push origin HEAD:fix/discord-source-level-dedup
