name: Verify Skill Bot Task 3

on:
  push:
    branches:
      - feat/skill-bot-integration
    paths:
      - '.github/workflows/verify-skill-bot-task3.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rapidfuzz numpy ollama httpx discord.py python-dotenv
      - run: python -m unittest tests.test_skill_search_service tests.test_skill_bot_config tests.test_discord_bot.DiscordConfigTests -v
      - run: grep -F '# SKILL_DATABASE_PATH=coryn_data/database/skills.sqlite' .env.example
