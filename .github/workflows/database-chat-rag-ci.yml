name: database-chat-rag-ci

on:
  push:
    branches:
      - feat/database-chat-rag
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run full test suite
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v
      - name: Static sanity
        run: |
          git diff --check HEAD^
          uv run python -m py_compile toram_discord/app.py toram_discord/config.py toram_discord/sessions.py
