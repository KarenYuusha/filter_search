name: Follow-up TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve legacy guild_id gate call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("discord_bot.py")
          text = path.read_text(encoding="utf-8")
          old = '''def is_allowed_message(message, *, bot_user_id: int, guild_ids: Iterable[int]) -> bool:\n    return (\n        message.guild is not None\n        and message.guild.id in guild_ids\n        and not getattr(message.author, "bot", False)\n        and getattr(message, "webhook_id", None) is None\n        and any(user.id == bot_user_id for user in getattr(message, "mentions", ()))\n    )\n'''
          new = '''def is_allowed_message(\n    message,\n    *,\n    bot_user_id: int,\n    guild_ids: Iterable[int] | None = None,\n    guild_id: int | None = None,\n) -> bool:\n    allowed_guild_ids = guild_ids if guild_ids is not None else (() if guild_id is None else (guild_id,))\n    return (\n        message.guild is not None\n        and message.guild.id in allowed_guild_ids\n        and not getattr(message.author, "bot", False)\n        and getattr(message, "webhook_id", None) is None\n        and any(user.id == bot_user_id for user in getattr(message, "mentions", ()))\n    )\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected is_allowed_message implementation not found")
          PY
          if ! git diff --quiet -- discord_bot.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add discord_bot.py
            git commit -m "fix: preserve legacy Discord guild gate call"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - name: Compile changed modules
        run: python -m py_compile discord_bot.py toram_search/service.py toram_search/help_db.py search_items.py
      - name: Focused regression suite
        run: >-
          python -m unittest
          tests.test_discord_followup_regressions
          tests.test_search_service
          tests.test_discord_bot
          tests.test_direct_structured_intent
          tests.test_llm
          -v
      - name: Full test suite
        run: python -m unittest discover -s tests -v
