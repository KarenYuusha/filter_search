name: skill-display-final-acceptance

on:
  push:
    branches:
      - verify/skill-display-pagination-final
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98f14a00e4db67cb28f700480161bc37721e37f5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact feature commit
        run: test "$(git rev-parse HEAD)" = "98f14a00e4db67cb28f700480161bc37721e37f5"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip discord.py rapidfuzz numpy ollama httpx python-dotenv
      - name: Run focused skill display tests
        run: |
          python -m unittest \
            tests.test_discord_skill_detail_pages \
            tests.test_discord_skill_search \
            tests.test_discord_skill_review_regressions \
            tests.test_discord_module_boundaries -v
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
