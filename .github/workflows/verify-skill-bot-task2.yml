name: Verify Skill Bot Task 2

on:
  push:
    branches:
      - feat/skill-bot-integration
    paths:
      - '.github/workflows/verify-skill-bot-task2.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rapidfuzz numpy ollama httpx
      - run: python -m unittest tests.test_skill_search_service tests.test_skill_hybrid_search -v
