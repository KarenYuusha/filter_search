name: Verify Discord Image Path Final

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact feature head
        run: |
          git fetch origin main fix/discord-image-path-resolution
          git checkout --detach 971c2fac6f915ed88f7a9bb2aff64226d07e10c1
          test "$(git rev-parse HEAD)" = "971c2fac6f915ed88f7a9bb2aff64226d07e10c1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile discord_bot.py search_items.py toram_search/service.py
      - name: Verify feature scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {'discord_bot.py', 'tests/test_discord_image_paths.py'}
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          assert changed == expected, (changed, expected)
          PY
      - name: Focused regression gate
        run: python -m unittest tests.test_discord_image_paths tests.test_discord_bot tests.test_search_service tests.test_discord_upgrade_display -v
      - name: Verify real database image resolution
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from discord_bot import valid_local_image_paths
          db_path = Path('coryn_data/database/items.sqlite')
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          images = [dict(row) for row in conn.execute("SELECT local_path FROM item_images WHERE local_path IS NOT NULL AND TRIM(local_path) <> '' ORDER BY id")]
          resolved = valid_local_image_paths(db_path, images)
          print(f'database_image_rows={len(images)} resolved_files={len(resolved)}')
          assert len(images) == 3982
          assert len(resolved) == 3981
          conn.close()
          PY
      - name: Full-suite final measurement
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
