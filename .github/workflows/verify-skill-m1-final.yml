name: Verify Skill Milestone 1 Final
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Compile
        run: python -m compileall -q toram_skills build_skills.py
      - name: Focused skill tests
        run: |
          python -m unittest tests.test_skill_source_inventory -v
          python -m unittest tests.test_skill_parsing -v
          python -m unittest tests.test_skill_field_normalization -v
          python -m unittest tests.test_skill_repository -v
          python -m unittest tests.test_skill_importer -v
          python -m unittest tests.test_core_module_boundaries -v
      - name: Build real skill database
        run: python build_skills.py --source raw_skills --database /tmp/skills.sqlite --json-report /tmp/skills-import-report.json
      - name: Verify database provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from toram_skills.repository import SkillRepository
          from toram_skills.source_inventory import discover_skill_sources, source_manifest_hash
          report = json.loads(Path('/tmp/skills-import-report.json').read_text(encoding='utf-8'))
          expected = source_manifest_hash(discover_skill_sources(Path('raw_skills')))
          with SkillRepository(Path('/tmp/skills.sqlite')) as repo:
              actual = repo.get_metadata('source_manifest_hash')
              print('TREES', repo.count_trees())
              print('SKILLS', repo.count_skills())
              print('ERRORS', report['errors'])
              print('WARNINGS', report['warnings'])
              print('MANIFEST', actual)
              assert actual == expected == report['manifest_hash']
              assert report['errors'] == 0
          PY
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: skill-m1-build
          path: |
            /tmp/skills.sqlite
            /tmp/skills-import-report.json
