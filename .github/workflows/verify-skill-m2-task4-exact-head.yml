name: Verify Skill M2 Task4 Exact Head

on:
  pull_request:
    branches:
      - feat/skill-hybrid-retrieval

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - run: python -m compileall -q toram_skills
      - name: Verify checked-in semantic schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from toram_skills.repository import SkillRepository
          with SkillRepository(Path('coryn_data/database/skills.sqlite')) as repo:
              assert repo.connection.execute('SELECT COUNT(*) FROM skill_search_documents').fetchone()[0] > 0
              assert repo.connection.execute('SELECT COUNT(*) FROM skill_embedding_vectors').fetchone()[0] == 0
          PY
      - run: python -m unittest tests.test_skill_semantic_search tests.test_skill_lexical_search tests.test_skill_structured_search -v
      - run: python -m unittest discover -s tests -v
