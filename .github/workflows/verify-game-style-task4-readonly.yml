name: Verify Single Result Auto Open Read Only

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin feature/game-style-item-presentation
          git checkout -B feature/game-style-item-presentation origin/feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile
        run: python -m py_compile toram_search/service.py tests/test_single_result_auto_open.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_single_result_auto_open.ServiceSingleResultAutoOpenTests \
            tests.test_search_service \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot -v
