name: Verify Discord Source Level Final

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact feature head
        run: |
          git fetch origin main fix/discord-source-level-dedup
          git checkout --detach d90e7ab2739b532ed0433d352a9f7457971b73bd
          test "$(git rev-parse HEAD)" = "d90e7ab2739b532ed0433d352a9f7457971b73bd"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile discord_bot.py search_items.py toram_search/service.py
      - name: Verify feature scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {'discord_bot.py', 'tests/test_discord_source_display.py'}
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          print('changed=', sorted(changed))
          assert changed == expected, (changed, expected)
          PY
      - name: Focused regression gate
        run: python -m unittest tests.test_discord_source_display tests.test_discord_bot tests.test_discord_image_paths -v
      - name: Verify real Mage Robe 513 display
        run: |
          python - <<'PY'
          from pathlib import Path
          import discord_bot
          import search_items as core

          repo = core.ItemRepository(Path('coryn_data/database/items.sqlite'))
          try:
              detail = repo.get_item(513)
          finally:
              repo.close()
          embed = discord_bot.build_item_detail_embed(detail)
          obtained = next(field.value for field in embed.fields if field.name == 'Obtained From')
          print(obtained)
          assert 'Fire Ghost (Lv 28) — Lv 28' not in obtained
          assert 'Jeila (Lv 50) — Lv 50' not in obtained
          assert 'Fire Ghost (Lv 28) — Fiery Volcano: Area 1' in obtained
          assert 'Jeila (Lv 50) — Halloween Castle — Dye: 41, 40, 85' in obtained
          PY
      - name: Full-suite final measurement
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
