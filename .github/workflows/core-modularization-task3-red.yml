name: Core modularization Task 3 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify extracted core modules are missing
        run: |
          python - <<'PY'
          import search_items
          from toram_data.models import ItemSummary
          from toram_data.repository import ItemRepository
          assert search_items.ItemSummary is ItemSummary
          assert search_items.ItemRepository is ItemRepository
          PY
