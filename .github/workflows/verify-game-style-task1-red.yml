name: Verify Game Style Task 1 RED

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin feature/game-style-item-presentation
          git checkout -B feature/game-style-item-presentation origin/feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Run RED regressions
        run: |
          python -m unittest \
            tests.test_game_style_stat_display \
            tests.test_action_speed_alias -v
