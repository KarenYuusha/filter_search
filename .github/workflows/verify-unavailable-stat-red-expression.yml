name: Verify Unavailable Stat RED Expression

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin fix/unavailable-stat-display
          git checkout -B fix/unavailable-stat-display origin/fix/unavailable-stat-display
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Run RED regression
        run: python -m unittest tests.test_unavailable_stat_display -v
