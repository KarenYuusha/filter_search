name: Upgrade Natural RED

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - name: Upgrade service RED
        run: python -m unittest tests.test_discord_followup_regressions.UpgradeLookupTests.test_selected_fuzzy_upgrade_candidate_returns_direct_successors -v
      - name: Discord UI RED
        run: python -m unittest tests.test_discord_bot.DiscordFormattingTests.test_upgrade_suggestion_payload_is_distinguished_from_direct_results tests.test_discord_bot.DiscordFormattingTests.test_bot_example_prefix_prefers_guild_display_name tests.test_discord_bot.DiscordFormattingTests.test_bot_example_prefix_falls_back_to_account_name tests.test_discord_bot.DiscordFormattingTests.test_service_message_builder_uses_display_name_parameter -v
