name: Upgrade Natural TDD

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - run: python -m unittest tests.test_discord_followup_regressions.UpgradeLookupTests tests.test_cli_upgrade.CliUpgradeTests.test_natural_upgrade_query_uses_direct_successor_screen_without_qwen -v
