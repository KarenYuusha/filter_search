name: Upgrade Natural TDD

on:
  push:
    branches: [feat/upgrade-natural-discord-name]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared natural-upgrade normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("search_items.py")
          text = path.read_text(encoding="utf-8")

          marker = "\ndef parse_search_query(query: str, repository: ItemRepository) -> ParsedSearch:\n"
          helper = r'''
_NATURAL_UPGRADE_PATTERNS = (
    r"upgrade\s+for\s+(.+)",
    r"upgrades\s+for\s+(.+)",
    r"(?:show|find)\s+upgrades\s+for\s+(.+)",
    r"what\s+upgrades\s+from\s+(.+)",
    r"what\s+can\s+upgrade\s+(.+)",
    r"what\s+comes\s+after\s+(.+)",
    r"next\s+xtal\s+after\s+(.+)",
)


def extract_natural_upgrade_target(text: str) -> str | None:
    cleaned = " ".join(text.strip().rstrip("?.!").split())
    if not cleaned:
        return None
    for pattern in _NATURAL_UPGRADE_PATTERNS:
        match = re.fullmatch(pattern, cleaned, flags=re.IGNORECASE)
        if match is not None:
            target = match.group(1).strip()
            return target or None
    return None

'''
          if "def extract_natural_upgrade_target(" not in text:
              if marker not in text:
                  raise SystemExit("parse_search_query marker not found")
              text = text.replace(marker, "\n" + helper + marker.lstrip("\n"), 1)

          old = '''    if not normalized:\n        return ParsedSearch("item_search", raw, item_query="")\n\n    first, _, remainder = raw.partition(" ")\n'''
          new = '''    if not normalized:\n        return ParsedSearch("item_search", raw, item_query="")\n\n    natural_upgrade_target = extract_natural_upgrade_target(raw)\n    if natural_upgrade_target is not None:\n        upgrade_exact = repository.exact_upgrade_name_matches(natural_upgrade_target)\n        canonical_query = f"upgrade {natural_upgrade_target}"\n        if len(upgrade_exact) == 1:\n            return ParsedSearch("exact_upgrade", canonical_query, item_id=upgrade_exact[0].id)\n        return ParsedSearch("upgrade_search", canonical_query, item_query=natural_upgrade_target)\n\n    first, _, remainder = raw.partition(" ")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("parse_search_query insertion point not found")

          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- search_items.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add search_items.py
            git commit -m "feat: normalize natural upgrade queries"
            git push origin HEAD:feat/upgrade-natural-discord-name
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - run: python -m py_compile search_items.py
      - run: python -m unittest tests.test_discord_followup_regressions.UpgradeLookupTests tests.test_cli_upgrade -v
