name: Discord Dotenv Full Verify

on:
  pull_request:
    branches:
      - main

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py==2.7.1' 'ollama>=0.6.2' 'rapidfuzz>=3.14.5' 'httpx>=0.27' 'python-dotenv>=1.1,<2' 'pillow>=12.3.0'
      - name: Compile changed Python files
        run: python -m py_compile discord_bot.py toram_search/service.py search_items.py
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v
