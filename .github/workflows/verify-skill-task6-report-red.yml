name: Verify Skill Task 6 Report RED
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_skill_importer.SkillImporterTests.test_report_rendering_and_json_are_deterministic tests.test_skill_importer.SkillImporterTests.test_build_cli_returns_zero_and_writes_json_report_for_valid_import -v
