name: Verify Discord Image Path RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out image-path feature branch
        run: |
          git fetch origin fix/discord-image-path-resolution
          git checkout -B fix/discord-image-path-resolution origin/fix/discord-image-path-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Run RED image-path tests
        run: python -m unittest tests.test_discord_image_paths -v
