name: Verify real equipment condition GREEN

on:
  push:
    branches:
      - verify/game-style-real-condition-green

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Apply minimal condition token fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('search_items.py')
          text = path.read_text(encoding='utf-8')

          old_mapping = '''    "shield": "Shield",
              "light armor": "Light Armor",
              "heavy armor": "Heavy Armor",
          }'''
          new_mapping = '''    "shield": "Shield",
              "light armor": "Light Armor",
              "heavy armor": "Heavy Armor",
              "additional gear": "Additional Gear",
              "armor": "Armor",
              "dual swords": "Dual Swords",
              "knuckle": "Knuckles",
              "ninjutsu scroll": "Ninjutsu Scroll",
              "special gear": "Special Gear",
          }'''
          if old_mapping not in text:
              raise SystemExit('expected equipment mapping block not found')
          text = text.replace(old_mapping, new_mapping, 1)

          old_normalize = '''        normalized = normalize_name(
                      re.sub(r"\\s+only\\s*$", "", part, flags=re.IGNORECASE)
                  )'''
          new_normalize = '''        normalized = normalize_name(
                      re.sub(r"\\s+only\\s*$", "", part, flags=re.IGNORECASE)
                  ).replace("_", " ")'''
          if old_normalize not in text:
              raise SystemExit('expected condition normalization block not found')
          text = text.replace(old_normalize, new_normalize, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused GREEN
        run: |
          python -m unittest \
            tests.test_game_style_stat_display.GameStyleConditionTests \
            tests.test_action_speed_alias \
            tests.test_unavailable_stat_display -v
      - name: Verify real Altadar grouping
        run: |
          python - <<'PY'
          import search_items as core
          from discord_bot import build_item_detail_embed

          repo = core.ItemRepository(core.DEFAULT_DATABASE)
          try:
              selected = repo.exact_name_matches('Altadar')[0]
              detail = repo.get_item(selected.id)
              terminal = core.render_item(detail)
              embed = build_item_detail_embed(detail)
              stats = next(field.value for field in embed.fields if field.name == 'Stats')
              for rendered in (terminal, stats):
                  assert 'With Light Armor' in rendered, rendered
                  assert 'With Heavy Armor' in rendered, rendered
                  assert rendered.count('Stability -5%') == 2, rendered
                  assert 'Heavy Armor,Light Armor only' not in rendered, rendered
          finally:
              repo.close()
          PY
      - name: Commit production fix when green
        run: |
          test "$(git diff --name-only)" = "search_items.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py
          git commit -m "fix: map real equipment condition tokens"
          git push origin HEAD:feature/game-style-item-presentation
