name: Discord Dotenv Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  dotenv-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-dotenv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py==2.7.1' 'ollama>=0.6.2' 'rapidfuzz>=3.14.5' 'httpx>=0.27' 'python-dotenv>=1.1,<2'
      - name: Apply exact dotenv source and README edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("discord_bot.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "import discord\n\nimport search_items as core",
                  "import discord\nfrom dotenv import load_dotenv\n\nimport search_items as core",
              ),
              (
                  "VIEW_TIMEOUT_SECONDS = 900\n\nSessionKey = tuple[int, int, int]",
                  "VIEW_TIMEOUT_SECONDS = 900\nPROJECT_ROOT = Path(__file__).resolve().parent\n\nSessionKey = tuple[int, int, int]",
              ),
              (
                  "\ndef load_config(environ: Mapping[str, str] = os.environ) -> DiscordBotConfig:\n",
                  "\ndef load_project_environment(env_path: Path | None = None) -> Path:\n"
                  "    path = env_path if env_path is not None else PROJECT_ROOT / \".env\"\n"
                  "    load_dotenv(dotenv_path=path, override=False)\n"
                  "    return path\n\n\n"
                  "def load_config(environ: Mapping[str, str] = os.environ) -> DiscordBotConfig:\n",
              ),
              (
                  "def main() -> None:\n    logging.basicConfig(level=logging.INFO)\n    config = load_config()",
                  "def main() -> None:\n    logging.basicConfig(level=logging.INFO)\n    load_project_environment()\n    config = load_config()",
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one source match for: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          old_section = '''### Environment

Set:

```text
DISCORD_BOT_TOKEN=<bot token>
DISCORD_GUILD_ID=<allowed server id>
OLLAMA_MODEL=qwen3.5:2b
```

`OLLAMA_MODEL` is optional; the existing local Ollama client defaults to `qwen3.5:2b`.

Do not hardcode the Discord token in source code.
'''
          new_section = '''### Environment

Create a `.env` file in the repository root, beside `discord_bot.py`:

```env
DISCORD_BOT_TOKEN=your_real_token
DISCORD_GUILD_ID=123456789012345678
OLLAMA_MODEL=qwen3.5:2b
```

You can copy `.env.example` as a safe template. The real `.env` is ignored by Git and must not be committed. Existing shell/OS environment variables take precedence over values in `.env`.

`OLLAMA_MODEL` is optional; the existing local Ollama client defaults to `qwen3.5:2b`.

Do not hardcode the Discord token in source code.
'''
          if new_section not in readme_text:
              if readme_text.count(old_section) != 1:
                  raise SystemExit("Expected exactly one README environment section")
              readme_text = readme_text.replace(old_section, new_section, 1)
          readme.write_text(readme_text, encoding="utf-8")
          PY
      - name: Commit implementation if not already present
        run: |
          if git diff --quiet; then
            echo "Implementation already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add discord_bot.py README.md
            git commit -m "feat: load Discord config from dotenv"
            git push origin HEAD:feat/discord-dotenv
          fi
      - name: Compile changed Python files
        run: python -m py_compile discord_bot.py toram_search/service.py search_items.py
      - name: Run focused regression gate
        run: |
          python -m unittest \
            tests.test_search_service \
            tests.test_discord_bot \
            tests.test_direct_structured_intent \
            tests.test_llm -v
