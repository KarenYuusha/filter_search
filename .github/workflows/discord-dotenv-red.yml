name: Discord Dotenv Red

on:
  pull_request:
    branches:
      - main

jobs:
  dotenv-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py==2.7.1' 'ollama>=0.6.2' 'rapidfuzz>=3.14.5' 'httpx>=0.27'
      - name: Run dotenv config tests before implementation
        run: python -m unittest tests.test_discord_bot.DiscordConfigTests -v
