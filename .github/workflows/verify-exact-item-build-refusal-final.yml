name: Verify Exact Item Build Refusal Final

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact feature head
        run: |
          git fetch origin main fix/exact-item-before-build-refusal
          git checkout --detach db26504e892bf08cc4917895428e8400980c291a
          test "$(git rev-parse HEAD)" = "db26504e892bf08cc4917895428e8400980c291a"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile search_items.py discord_bot.py toram_search/service.py
      - name: Verify feature scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {'search_items.py', 'tests/test_exact_item_build_refusal.py'}
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          print('changed=', sorted(changed))
          assert changed == expected, (changed, expected)
          PY
      - name: Focused regression gate
        run: python -m unittest tests.test_exact_item_build_refusal tests.test_direct_structured_intent tests.test_search_service tests.test_discord_bot -v
      - name: Verify real Discord Mage Robe outcome
        run: |
          python - <<'PY'
          from pathlib import Path
          import discord_bot
          import search_items as core
          from toram_search.service import ItemResultsPayload, SearchService
          from toram_search.session import FailedQueryContext

          class MustNotCallLLM:
              def complete(self, *args, **kwargs):
                  raise AssertionError('exact item-name search must not call Qwen')

          db_path = Path('coryn_data/database/items.sqlite')
          repo = core.ItemRepository(db_path)
          try:
              outcome = SearchService(repo, llm_client=MustNotCallLLM()).handle_query(
                  'mage robe', FailedQueryContext()
              )
          finally:
              repo.close()

          assert outcome.kind == 'search', outcome.kind
          assert isinstance(outcome.payload, ItemResultsPayload), type(outcome.payload)
          results = outcome.payload.results
          print('result_count=', len(results))
          print('results=', [(r.item.id, r.item.name, r.item.item_type) for r in results])
          assert len(results) == 3
          assert all(r.item.name == 'Mage Robe' for r in results)

          sessions = discord_bot.DiscordSessionManager()
          key = (1, 2, 3)
          session = sessions.start_query(key, 'mage robe')
          embed, view, file = discord_bot.build_service_outcome_message(
              outcome,
              bot_example_prefix='@Bot',
              sessions=sessions,
              key=key,
              generation=session.generation,
              database_path=db_path,
          )
          print('embed_title=', embed.title)
          assert embed.title != 'Unsupported request'
          assert isinstance(view, discord_bot.SearchResultsView)
          assert file is None
          PY
      - name: Full-suite final measurement
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
