name: Verify Skill Task 6 Marker RED
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_skill_parsing.SkillParsingTests.test_unparsed_skill_marker_is_an_explicit_error -v
