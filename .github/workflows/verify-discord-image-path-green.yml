name: Verify Discord Image Path GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patch helper
        run: cp .github/scripts/apply_discord_image_path_fix.py /tmp/apply_discord_image_path_fix.py
      - name: Check out image-path feature branch
        run: |
          git fetch origin fix/discord-image-path-resolution
          git checkout -B fix/discord-image-path-resolution origin/fix/discord-image-path-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal path fix
        run: python /tmp/apply_discord_image_path_fix.py
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile Discord bot
        run: python -m py_compile discord_bot.py
      - name: Run image-path regressions
        run: python -m unittest tests.test_discord_image_paths tests.test_discord_bot -v
      - name: Verify real database image resolution
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from discord_bot import valid_local_image_paths

          db_path = Path('coryn_data/database/items.sqlite')
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          rows = conn.execute('''
              SELECT local_path
              FROM item_images
              WHERE local_path IS NOT NULL AND TRIM(local_path) <> ''
              ORDER BY id
          ''').fetchall()
          images = [dict(row) for row in rows]
          resolved = valid_local_image_paths(db_path, images)
          print(f'database_image_rows={len(images)} resolved_files={len(resolved)}')
          assert len(resolved) >= 3981, len(resolved)
          PY
      - name: Commit production fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord_bot.py
          git commit -m "fix: resolve parser image paths for Discord"
          git push origin HEAD:fix/discord-image-path-resolution
