name: Natural give ranking TDD

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-give-highest-stat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Apply minimal natural grammar fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('toram_data/stat_query.py')
          text = path.read_text(encoding='utf-8')
          old = r're.compile(r"^\s*which\s+(.+?)\s+(?:has|have)\s+(.+?)\s*$", re.IGNORECASE),'
          new = r're.compile(r"^\s*which\s+(.+?)\s+(?:has|have|give|gives)\s+(.+?)\s*$", re.IGNORECASE),'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('target natural search pattern not found')
          PY
      - name: Run focused regression
        run: python -m unittest tests.test_natural_give_ranking tests.test_direct_structured_intent -v
      - name: Commit production fix if needed
        run: |
          if git diff --quiet -- toram_data/stat_query.py; then
            echo 'Production fix already present.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_data/stat_query.py
          git commit -m "fix: recognize give ranking queries"
          git push origin HEAD:fix/natural-give-highest-stat
