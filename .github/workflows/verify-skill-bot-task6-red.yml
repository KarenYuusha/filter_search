name: Verify Skill Bot Task 6 RED

on:
  push:
    branches:
      - feat/skill-bot-integration
    paths:
      - '.github/workflows/verify-skill-bot-task6-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rapidfuzz numpy ollama httpx discord.py python-dotenv
      - run: python -m unittest tests.test_discord_module_boundaries tests.test_discord_skill_search -v
