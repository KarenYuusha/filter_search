name: Verify Hybrid Upgrade Discord GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Discord patch helper
        shell: bash
        run: |
          cp .github/scripts/apply_upgrade_hybrid_discord.py /tmp/apply_upgrade_hybrid_discord.py
          git fetch origin design/upgrade-hybrid-display
          git checkout -B design/upgrade-hybrid-display origin/design/upgrade-hybrid-display
      - name: Apply Discord implementation
        run: python /tmp/apply_upgrade_hybrid_discord.py
      - name: Commit Discord implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord_bot.py
          git commit -m "feat: show hybrid upgrade display in Discord"
          git push origin HEAD:design/upgrade-hybrid-display
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - name: Compile Discord code
        run: python -m py_compile search_items.py discord_bot.py
      - name: Hybrid display GREEN gate
        run: python -m unittest tests.test_upgrade_display tests.test_cli_upgrade tests.test_discord_upgrade_display tests.test_discord_bot -v
