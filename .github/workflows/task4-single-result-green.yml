name: Task 4 single-result auto-open

on:
  pull_request:
  push:
    branches:
      - feature/game-style-item-presentation

permissions:
  contents: write

jobs:
  task4-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Implement sole-result service short-circuits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("toram_search/service.py")
          text = path.read_text(encoding="utf-8")

          changes = (
              (
                  "            return ItemResultsPayload(query, tuple(results))\n",
                  "            if len(results) == 1:\n"
                  "                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n"
                  "            return ItemResultsPayload(query, tuple(results))\n",
              ),
              (
                  "            return UpgradeResultsPayload(query, tuple(results))\n",
                  "            if len(results) == 1:\n"
                  "                selected_id = results[0].item.id\n"
                  "                return UpgradeDetailPayload(\n"
                  "                    graph=self.repository.get_upgrade_component(selected_id),\n"
                  "                    selected_item_id=selected_id,\n"
                  "                )\n"
                  "            return UpgradeResultsPayload(query, tuple(results))\n",
              ),
              (
                  "            return StatResultsPayload(parsed, tuple(results))\n",
                  "            if len(results) == 1:\n"
                  "                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n"
                  "            return StatResultsPayload(parsed, tuple(results))\n",
              ),
              (
                  "            return ExpressionResultsPayload(resolved, tuple(results))\n",
                  "            if len(results) == 1:\n"
                  "                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n"
                  "            return ExpressionResultsPayload(resolved, tuple(results))\n",
              ),
          )

          for old, new in changes:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target, found {text.count(old)}: {old.strip()}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify Task 4 GREEN
        run: |
          python -m unittest \
            tests.test_single_result_auto_open.ServiceSingleResultAutoOpenTests \
            tests.test_search_service \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot -v
      - name: Synchronize, reverify, and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_search/service.py
          if git diff --cached --quiet; then
            echo "Task 4 already applied"
            exit 0
          fi
          git commit -m "feat: auto-open sole service search result"
          git fetch origin feature/game-style-item-presentation
          git rebase origin/feature/game-style-item-presentation
          python -m unittest \
            tests.test_single_result_auto_open.ServiceSingleResultAutoOpenTests \
            tests.test_search_service \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot -v
          git push origin HEAD:feature/game-style-item-presentation
