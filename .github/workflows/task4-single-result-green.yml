name: Task 4 single-result auto-open

on:
  pull_request:
  push:
    branches:
      - feature/game-style-item-presentation

permissions:
  contents: write

jobs:
  task4-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Verify Task 4 RED
        run: python -m unittest tests.test_single_result_auto_open.ServiceSingleResultAutoOpenTests -v
