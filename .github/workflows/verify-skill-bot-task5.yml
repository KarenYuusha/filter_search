name: Verify Skill Bot Task 5

on:
  push:
    branches:
      - feat/skill-bot-integration
    paths:
      - '.github/workflows/verify-skill-bot-task5.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rapidfuzz numpy ollama httpx discord.py python-dotenv
      - run: python -m unittest tests.test_discord_skill_search tests.test_discord_followup_regressions tests.test_discord_bot -v
