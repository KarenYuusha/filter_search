name: Verify Item Search Relevance GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare relevance patch helper
        run: cp .github/scripts/apply_item_search_relevance_fix.py /tmp/apply_item_search_relevance_fix.py
      - name: Check out relevance feature branch
        run: |
          git fetch origin fix/item-upgrade-search-relevance
          git checkout -B fix/item-upgrade-search-relevance origin/fix/item-upgrade-search-relevance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal shared relevance fix
        run: python /tmp/apply_item_search_relevance_fix.py
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Run relevance tests
        run: python -m unittest tests.test_item_search_relevance -v
      - name: Run nearby regressions
        run: |
          python -m unittest \
            tests.test_item_search_relevance \
            tests.test_search_service \
            tests.test_cli_upgrade \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot -v
      - name: Commit production fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py
          git commit -m "fix: filter irrelevant item search candidates"
          git push origin HEAD:fix/item-upgrade-search-relevance
