name: Verify database grounding main postmerge

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - run: python -m compileall -q toram_data toram_search toram_discord search_items.py discord_bot.py
      - run: python -m unittest tests.test_database_question_grounding -v
      - run: python -m unittest tests.test_structured_fallback -v
      - run: python -m unittest tests.test_search_service -v
      - run: python -m unittest discover -s tests -v
