name: Verify Upgrade Chain Multi-Stat Final

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upgrade-natural-discord-name-green
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'discord.py>=2.7.1,<3' 'ollama>=0.6.2' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5'
      - name: Compile final code
        run: python -m py_compile search_items.py discord_bot.py toram_search/service.py toram_data/stat_query.py
      - name: Focused final gate
        run: python -m unittest tests.test_cli_upgrade tests.test_discord_followup_regressions tests.test_discord_bot tests.test_search_service tests.test_direct_structured_intent tests.test_llm -v
      - name: Full-suite final measurement
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
