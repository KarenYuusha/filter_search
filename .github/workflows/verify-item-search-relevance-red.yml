name: Verify Item Search Relevance RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out relevance feature branch
        run: |
          git fetch origin fix/item-upgrade-search-relevance
          git checkout -B fix/item-upgrade-search-relevance origin/fix/item-upgrade-search-relevance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Run RED relevance tests
        run: python -m unittest tests.test_item_search_relevance -v
