name: stat-row-drag-reordering-ci

on:
  push:
    branches:
      - feat/stat-row-drag-reordering
    paths:
      - toram_gui/stats_tab.py
      - tests/test_stats_tab_reordering.py

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Focused stat reorder tests
        run: uv run python -m unittest tests.test_stats_tab_reordering -v
      - name: Full regression suite
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v
      - name: Static sanity
        run: uv run python -m py_compile toram_gui/stats_tab.py tests/test_stats_tab_reordering.py
