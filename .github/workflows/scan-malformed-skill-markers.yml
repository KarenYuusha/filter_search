name: Scan Malformed Skill Markers
on: pull_request
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan raw skill headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          marker_re = re.compile(r'(?mi)^SKILL:\s*(.*?)\s*$')
          placeholder_re = re.compile(r'^(?:-|--+|\?+|n/?a|none|null|unknown|unnamed|tbd|todo)$', re.I)
          lv_re = re.compile(r'^Lv\s*(?:\d+|[IVX]+)\b', re.I)

          malformed = []
          placeholders = []
          missing_header_candidates = []
          total = 0

          for path in sorted(Path('raw_skills').rglob('*.txt')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              for match in marker_re.finditer(text):
                  total += 1
                  name = match.group(1).strip()
                  line = text.count('\n', 0, match.start()) + 1
                  slug = re.sub(r'[^a-z0-9]+', '-', name.casefold()).strip('-')
                  if not slug:
                      malformed.append((path.as_posix(), line, name))
                  elif placeholder_re.fullmatch(name):
                      placeholders.append((path.as_posix(), line, name))

              # Candidate missing SKILL: header: a plain standalone name followed by an Lv... details line.
              # Correctly marked blocks normally have "Source Details:" immediately before Lv..., so this
              # pattern targets legacy/unmarked blocks such as "Aerial Cut\nLv 5; ...".
              for i in range(len(lines) - 1):
                  name = lines[i].strip()
                  next_line = lines[i + 1].strip()
                  if not name or not lv_re.match(next_line):
                      continue
                  if name.startswith(('SKILL:', 'Category:', 'Tier:', 'Required Level:', 'Source Details:')):
                      continue
                  if ':' in name or name.startswith(('-', '*', '•', '#', '=')):
                      continue
                  if len(name) > 80:
                      continue
                  missing_header_candidates.append((path.as_posix(), i + 1, name, next_line))

          print(f'TOTAL_MARKERS={total}')
          print(f'MALFORMED_COUNT={len(malformed)}')
          for path, line, name in malformed:
              print(f'MALFORMED\t{path}:{line}\t{name!r}')
          print(f'PLACEHOLDER_COUNT={len(placeholders)}')
          for path, line, name in placeholders:
              print(f'PLACEHOLDER\t{path}:{line}\t{name!r}')
          print(f'MISSING_HEADER_CANDIDATE_COUNT={len(missing_header_candidates)}')
          for path, line, name, details in missing_header_candidates:
              print(f'MISSING_HEADER_CANDIDATE\t{path}:{line}\t{name!r}\t{details!r}')
          PY
