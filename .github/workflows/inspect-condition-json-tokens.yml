name: Real equipment condition token GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Apply explicit internal-token aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('search_items.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    "1 handed sword": "1-Handed Sword",\n': '    "1 handed sword": "1-Handed Sword",\n    "one handed sword": "1-Handed Sword",\n',
              '    "2 handed sword": "2-Handed Sword",\n': '    "2 handed sword": "2-Handed Sword",\n    "two handed sword": "2-Handed Sword",\n',
              '    "additional gear": "Additional Gear",\n': '    "additional gear": "Additional Gear",\n    "additional": "Additional Gear",\n',
              '    "special gear": "Special Gear",\n': '    "special gear": "Special Gear",\n    "special": "Special Gear",\n',
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'expected mapping line not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused GREEN
        run: |
          python -m unittest \
            tests.test_game_style_stat_display.GameStyleConditionTests \
            tests.test_game_style_stat_display.GameStyleFrontendParityTests \
            tests.test_unavailable_stat_display -v
      - name: Verify full real condition vocabulary
        run: |
          python - <<'PY'
          import sqlite3
          import search_items as core

          con = sqlite3.connect('coryn_data/database/items.sqlite')
          con.row_factory = sqlite3.Row
          try:
              rows = con.execute(
                  "SELECT DISTINCT conditions_json, condition_text FROM item_stats "
                  "WHERE conditions_json IS NOT NULL AND trim(conditions_json) NOT IN ('', '[]')"
              ).fetchall()
              unresolved = []
              for row in rows:
                  text = str(row['condition_text'] or '')
                  probe = {
                      'conditions_json': row['conditions_json'],
                      'condition_text': row['condition_text'],
                      'needs_condition_review': False,
                  }
                  names = core._equipment_condition_names(probe)
                  if text.lower().endswith(' only') and text.lower() != 'event only' and not names:
                      unresolved.append((row['conditions_json'], text))
              assert not unresolved, unresolved
          finally:
              con.close()
          PY
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git diff --name-only)" = "search_items.py"
          git add search_items.py
          git commit -m "fix: map stored equipment condition tokens"
          git push origin HEAD:feature/game-style-item-presentation
