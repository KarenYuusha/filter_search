name: Real equipment condition token RED

on:
  pull_request:

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Add regression test for real stored tokens
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_game_style_stat_display.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_verified_real_equipment_vocabulary_is_explicitly_mapped(self):\n'
          test = '''    def test_real_internal_equipment_tokens_use_game_style_names(self):
              cases = (
                  (("one_handed_sword",), "1-Handed Sword only", "With 1-Handed Sword"),
                  (("two_handed_sword",), "2-Handed Sword only", "With 2-Handed Sword"),
                  (("additional",), "Additional Gear only", "With Additional Gear"),
                  (("special",), "Special Gear only", "With Special Gear"),
                  (
                      (
                          "knuckles",
                          "magic_device",
                          "staff",
                          "bowgun",
                          "bow",
                          "two_handed_sword",
                          "one_handed_sword",
                      ),
                      "Knuckle,Magic Device,Staff,Bowgun,Bow,2-Handed Sword,1-Handed Sword only",
                      "With Knuckles / Magic Device / Staff / Bowgun / Bow / 2-Handed Sword / 1-Handed Sword",
                  ),
              )
              for conditions, condition_text, expected in cases:
                  with self.subTest(condition_text=condition_text):
                      row = stat(
                          "STR",
                          1,
                          *conditions,
                          condition_text=condition_text,
                      )
                      self.assertEqual(core.format_condition_display(row), expected)

'''
          if 'def test_real_internal_equipment_tokens_use_game_style_names' not in text:
              if marker not in text:
                  raise SystemExit('insertion marker not found')
              text = text.replace(marker, test + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify RED
        run: |
          set +e
          python -m unittest \
            tests.test_game_style_stat_display.GameStyleConditionTests.test_real_internal_equipment_tokens_use_game_style_names -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new real-token regression to fail before the production fix.'
            exit 1
          fi
          echo 'RED confirmed: real stored equipment tokens are not fully mapped yet.'
      - name: Commit regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git diff --name-only)" = "tests/test_game_style_stat_display.py"
          git add tests/test_game_style_stat_display.py
          git commit -m "test: cover real equipment condition tokens"
          git push origin HEAD:feature/game-style-item-presentation
