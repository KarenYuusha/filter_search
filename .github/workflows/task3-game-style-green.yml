name: Task 3 game-style green

on:
  pull_request:
  push:
    branches:
      - feature/game-style-item-presentation

permissions:
  contents: write

jobs:
  task3-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Implement compact and Discord presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def function_span(text: str, name: str) -> tuple[int, int]:
              start = text.index(f"def {name}(")
              next_def = text.find("\ndef ", start + 1)
              return start, len(text) if next_def < 0 else next_def + 1

          def replace_between(
              text: str,
              function_name: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              applied_marker: str,
          ) -> str:
              if applied_marker in text:
                  return text
              fn_start, fn_end = function_span(text, function_name)
              segment = text[fn_start:fn_end]
              rel_start = segment.index(start_marker)
              rel_end = segment.index(end_marker, rel_start)
              updated = segment[:rel_start] + replacement + segment[rel_end:]
              return text[:fn_start] + updated + text[fn_end:]

          search_path = Path("search_items.py")
          search = search_path.read_text(encoding="utf-8")
          terminal_loop = '''    for index, result in enumerate(current, start=1):
              primary_line = format_stat_display(stat_name, result.primary.amount)
              condition = format_condition_display(result.primary)
              if condition:
                  primary_line += f" [{condition}]"
              lines.append(
                  f"{index}. {result.item.name} — {result.item.item_type} — {primary_line}"
              )
              for alternative in result.alternatives:
                  alternative_line = "   Also: " + format_stat_display(
                      stat_name,
                      alternative.amount,
                  )
                  alternative_condition = format_condition_display(alternative)
                  if alternative_condition:
                      alternative_line += f" [{alternative_condition}]"
                  lines.append(alternative_line)
          '''
          search = replace_between(
              search,
              "render_stat_results",
              "    for index, result in enumerate(current, start=1):\n",
              "    if not results:\n",
              terminal_loop,
              "primary_line = format_stat_display(stat_name, result.primary.amount)",
          )
          expr_start, expr_end = function_span(search, "render_expression_results")
          expr = search[expr_start:expr_end]
          expr = expr.replace(
              "                condition = _condition_label(row)\n",
              "                condition = format_condition_display(row)\n",
          )
          search = search[:expr_start] + expr + search[expr_end:]
          search_path.write_text(search, encoding="utf-8")

          discord_path = Path("discord_bot.py")
          discord = discord_path.read_text(encoding="utf-8")
          result_lines_start, result_lines_end = function_span(discord, "_result_lines")
          result_lines = discord[result_lines_start:result_lines_end]
          if "primary = core.format_stat_display(stat_name, result.primary.amount)" not in result_lines:
              stat_start = result_lines.index("    if isinstance(payload, StatResultsPayload):\n")
              stat_end = result_lines.index(
                  "    if isinstance(payload, ExpressionResultsPayload):\n",
                  stat_start,
              )
              stat_block = '''    if isinstance(payload, StatResultsPayload):
                  result = payload.results[index]
                  parsed = payload.parsed
                  stat_name = parsed.stat.stat_name if parsed.stat else result.primary.stat_name
                  primary = core.format_stat_display(stat_name, result.primary.amount)
                  condition = core.format_condition_display(result.primary)
                  if condition:
                      primary += f" [{condition}]"
                  return [
                      f"**{result.item.name}** — {result.item.item_type}",
                      primary,
                  ]

          '''
              result_lines = result_lines[:stat_start] + stat_block + result_lines[stat_end:]
          result_lines = result_lines.replace(
              "                condition = _condition_label(row)\n",
              "                condition = core.format_condition_display(row)\n",
          )
          discord = discord[:result_lines_start] + result_lines + discord[result_lines_end:]

          detail_block = '''    stat_lines: list[str] = []
              for group in core.build_item_stat_groups(detail.stats):
                  if group.heading is not None:
                      if stat_lines:
                          stat_lines.append("")
                      stat_lines.append(f"**{group.heading}**")
                  stat_lines.extend(group.lines)
              _safe_field(embed, "Stats", "\\n".join(stat_lines) if stat_lines else "None")

          '''
          discord = replace_between(
              discord,
              "build_item_detail_embed",
              "    stat_lines: list[str] = []\n",
              "    source_lines: list[str] = []\n",
              detail_block,
              "for group in core.build_item_stat_groups(detail.stats):",
          )
          discord_path.write_text(discord, encoding="utf-8")
          PY
      - name: Verify Task 3 GREEN
        run: python -m unittest tests.test_game_style_stat_display tests.test_action_speed_alias tests.test_unavailable_stat_display tests.test_discord_bot tests.test_discord_source_display -v
      - name: Commit Task 3 when changed
        run: |
          if git diff --quiet -- search_items.py discord_bot.py; then
            echo "Task 3 already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py discord_bot.py
          git commit -m "feat: use game-style stat presentation in discord"
          git push origin HEAD:feature/game-style-item-presentation
