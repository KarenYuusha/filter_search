name: Task 3 game-style green

on:
  pull_request:
  push:
    branches:
      - feature/game-style-item-presentation

permissions:
  contents: write

jobs:
  task3-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2' 'rapidfuzz>=3.14.5' 'ollama>=0.6.2'
      - name: Implement compact and Discord presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          search_path = Path('search_items.py')
          search = search_path.read_text(encoding='utf-8')

          old_stat = '''    for index, result in enumerate(current, start=1):
              lines.append(
                  f"{index}. {result.item.name} — {result.item.item_type} — "
                  + format_stat_display(stat_name, result.primary.amount)
              )
              condition = _condition_label(result.primary)
              if condition:
                  lines.append(f"   Condition: {condition}")
              for alternative in result.alternatives:
                  alternative_value = format_stat_value(stat_name, alternative.amount, signed=True)
                  alternative_line = f"   Also: {alternative_value or stat_name}"
                  alternative_condition = _condition_label(alternative)
                  if alternative_condition:
                      alternative_line += f" — {alternative_condition}"
                  lines.append(alternative_line)
          '''
          new_stat = '''    for index, result in enumerate(current, start=1):
              primary_line = format_stat_display(stat_name, result.primary.amount)
              condition = format_condition_display(result.primary)
              if condition:
                  primary_line += f" [{condition}]"
              lines.append(
                  f"{index}. {result.item.name} — {result.item.item_type} — {primary_line}"
              )
              for alternative in result.alternatives:
                  alternative_line = "   Also: " + format_stat_display(
                      stat_name,
                      alternative.amount,
                  )
                  alternative_condition = format_condition_display(alternative)
                  if alternative_condition:
                      alternative_line += f" [{alternative_condition}]"
                  lines.append(alternative_line)
          '''
          if 'primary_line = format_stat_display(stat_name, result.primary.amount)' not in search:
              if old_stat not in search:
                  raise SystemExit('expected old terminal stat-result block not found')
              search = search.replace(old_stat, new_stat, 1)

          search = search.replace(
              '                condition = _condition_label(row)\n',
              '                condition = format_condition_display(row)\n',
              1,
          )
          search_path.write_text(search, encoding='utf-8')

          discord_path = Path('discord_bot.py')
          discord = discord_path.read_text(encoding='utf-8')

          old_discord_stat = '''    if isinstance(payload, StatResultsPayload):
              result = payload.results[index]
              parsed = payload.parsed
              stat_name = parsed.stat.stat_name if parsed.stat else result.primary.stat_name
              lines = [
                  f"**{result.item.name}** — {result.item.item_type}",
                  core.format_stat_display(stat_name, result.primary.amount),
              ]
              condition = _condition_label(result.primary)
              if condition:
                  lines.append(f"Condition: {condition}")
              return lines
          '''
          new_discord_stat = '''    if isinstance(payload, StatResultsPayload):
              result = payload.results[index]
              parsed = payload.parsed
              stat_name = parsed.stat.stat_name if parsed.stat else result.primary.stat_name
              primary = core.format_stat_display(stat_name, result.primary.amount)
              condition = core.format_condition_display(result.primary)
              if condition:
                  primary += f" [{condition}]"
              return [
                  f"**{result.item.name}** — {result.item.item_type}",
                  primary,
              ]
          '''
          if 'primary = core.format_stat_display(stat_name, result.primary.amount)' not in discord:
              if old_discord_stat not in discord:
                  raise SystemExit('expected old Discord stat-result block not found')
              discord = discord.replace(old_discord_stat, new_discord_stat, 1)

          discord = discord.replace(
              '                condition = _condition_label(row)\n',
              '                condition = core.format_condition_display(row)\n',
              1,
          )

          old_detail = '''    stat_lines: list[str] = []
              for stat in detail.stats:
                  line = core.format_stat_display(
                      stat.get("stat_name") or "Unknown stat",
                      stat.get("amount"),
                  )
                  condition = _condition_label(stat)
                  if condition:
                      line += f" [{condition}]"
                  stat_lines.append(line)
              _safe_field(embed, "Stats", "\\n".join(stat_lines) if stat_lines else "None")
          '''
          new_detail = '''    stat_lines: list[str] = []
              for group in core.build_item_stat_groups(detail.stats):
                  if group.heading is not None:
                      if stat_lines:
                          stat_lines.append("")
                      stat_lines.append(f"**{group.heading}**")
                  stat_lines.extend(group.lines)
              _safe_field(embed, "Stats", "\\n".join(stat_lines) if stat_lines else "None")
          '''
          if 'for group in core.build_item_stat_groups(detail.stats):' not in discord:
              if old_detail not in discord:
                  raise SystemExit('expected old Discord item-detail stats block not found')
              discord = discord.replace(old_detail, new_detail, 1)

          discord_path.write_text(discord, encoding='utf-8')
          PY
      - name: Verify Task 3 GREEN
        run: python -m unittest tests.test_game_style_stat_display tests.test_action_speed_alias tests.test_unavailable_stat_display tests.test_discord_bot tests.test_discord_source_display -v
      - name: Commit Task 3 when changed
        run: |
          if git diff --quiet -- search_items.py discord_bot.py; then
            echo "Task 3 already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py discord_bot.py
          git commit -m "feat: use game-style stat presentation in discord"
          git push origin HEAD:feature/game-style-item-presentation
