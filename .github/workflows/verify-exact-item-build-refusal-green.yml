name: Verify Exact Item Build Refusal GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patch helper
        run: cp .github/scripts/apply_exact_item_build_refusal_fix.py /tmp/apply_fix.py
      - name: Check out feature branch
        run: |
          git fetch origin fix/exact-item-before-build-refusal
          git checkout -B fix/exact-item-before-build-refusal origin/fix/exact-item-before-build-refusal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal routing fix
        run: python /tmp/apply_fix.py
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile search_items.py discord_bot.py toram_search/service.py
      - name: Run focused routing regressions
        run: python -m unittest tests.test_exact_item_build_refusal tests.test_direct_structured_intent tests.test_search_service -v
      - name: Verify real Mage Robe routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import search_items as core
          from toram_search.help_db import HelpService

          repo = core.ItemRepository(Path('coryn_data/database/items.sqlite'))
          try:
              route = core.route_deterministically(
                  'mage robe',
                  repo,
                  repo.list_items(),
                  HelpService(),
                  core.make_database_question_service(repo),
              )
              exact = repo.exact_name_matches('mage robe')
              print('exact_matches=', [(x.id, x.name, x.item_type) for x in exact])
              print('route_kind=', route.kind)
              print('parsed_intent=', route.parsed.intent if route.parsed else None)
              assert len(exact) == 3
              assert route.kind == 'search'
              assert route.parsed is not None and route.parsed.intent == 'item_search'
          finally:
              repo.close()
          PY
      - name: Commit production fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py
          git commit -m "fix: prefer exact item names over build refusal"
          git push origin HEAD:fix/exact-item-before-build-refusal
