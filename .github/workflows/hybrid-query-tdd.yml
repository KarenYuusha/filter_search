name: Hybrid query TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-query-interpretation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Apply Task 4 Discord rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('discord_bot.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if outcome.kind == "failed":\n        return (\n            _build_text_embed(\n                "I couldn't interpret that search",\n                "Try an explicit item/stat query, for example:\\n"\n                f"• `{bot_example_prefix} hp armor`\\n"\n                f"• `{bot_example_prefix} cr bow`\\n"\n                f"• `{bot_example_prefix} hp > 5000 and cr bow`",\n            ),\n            None,\n            None,\n        )\n'''
          new = '''    if outcome.kind == "failed":\n        if outcome.suggested_query:\n            description = (\n                "Did you mean: "\n                f"`{bot_example_prefix} {outcome.suggested_query}`"\n            )\n        else:\n            description = (\n                "Try an explicit item/stat query, for example:\\n"\n                f"• `{bot_example_prefix} hp armor`\\n"\n                f"• `{bot_example_prefix} cr bow`\\n"\n                f"• `{bot_example_prefix} hp > 5000 and cr bow`"\n            )\n        return (\n            _build_text_embed(\n                "I couldn't interpret that search",\n                description,\n            ),\n            None,\n            None,\n        )\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('failed outcome rendering block not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Reconstruction focused gate
        run: python -m unittest tests.test_query_reconstruction -v
      - name: Service and parser regressions
        run: |
          python -m unittest \
            tests.test_search_service \
            tests.test_direct_structured_intent \
            tests.test_natural_give_ranking -v
      - name: Discord regressions
        run: python -m unittest tests.test_discord_bot -v
      - name: Full suite against known main baseline
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          status=$?
          set -e
          cat /tmp/full-suite.txt
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'test_rejected_payload_is_logged_with_reason' /tmp/full-suite.txt
          grep -q 'FAILED (failures=1)' /tmp/full-suite.txt
      - name: Commit Task 4 Discord rendering
        shell: bash
        run: |
          git add discord_bot.py
          if git diff --cached --quiet; then
            echo 'Task 4 Discord changes already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: show safe query suggestions in discord'
          git push origin HEAD:feature/hybrid-query-interpretation
