name: Hybrid query TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-query-interpretation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Apply Task 3 failed-query suggestions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('toram_search/service.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from toram_search.reconstruction import try_reconstruct_simple_search\n'
          new_import = '''from toram_search.reconstruction import (\n    try_reconstruct_simple_search,\n    try_suggest_query,\n)\n'''
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('reconstruction import not found')
              text = text.replace(old_import, new_import, 1)

          field = '    suggested_query: str | None = None\n'
          marker = '    search_requests: tuple[SearchIntentRequest, ...] = ()\n'
          if field not in text:
              if marker not in text:
                  raise SystemExit('ServiceOutcome field insertion point not found')
              text = text.replace(marker, marker + field, 1)

          old_final = '''        if fallback.kind == "unavailable":\n            return ServiceOutcome("unavailable")\n        return ServiceOutcome("failed")\n'''
          new_final = '''        if fallback.kind == "unavailable":\n            return ServiceOutcome("unavailable")\n        suggestion = try_suggest_query(\n            query,\n            available_stats=self.repository.list_stat_names(),\n            available_item_types=self.repository.list_item_types(),\n        )\n        if suggestion is not None:\n            suggestion_route = core.route_deterministically(\n                suggestion,\n                self.repository,\n                self.all_items,\n                self.help_service,\n                self.database_service,\n            )\n            if suggestion_route.kind == "search" and suggestion_route.parsed is not None:\n                context.set_latest_suggestion(suggestion)\n                return ServiceOutcome("failed", suggested_query=suggestion)\n        return ServiceOutcome("failed")\n'''
          if new_final not in text:
              if old_final not in text:
                  raise SystemExit('final failure insertion point not found')
              text = text.replace(old_final, new_final, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Reconstruction focused gate
        run: python -m unittest tests.test_query_reconstruction -v
      - name: Service and parser regressions
        run: |
          python -m unittest \
            tests.test_search_service \
            tests.test_direct_structured_intent \
            tests.test_natural_give_ranking -v
      - name: Discord regressions
        run: python -m unittest tests.test_discord_bot -v
      - name: Full suite against known main baseline
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          status=$?
          set -e
          cat /tmp/full-suite.txt
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'test_rejected_payload_is_logged_with_reason' /tmp/full-suite.txt
          grep -q 'FAILED (failures=1)' /tmp/full-suite.txt
      - name: Commit Task 3 failed-query suggestions
        shell: bash
        run: |
          git add toram_search/service.py
          if git diff --cached --quiet; then
            echo 'Task 3 service changes already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add safe failed query suggestions'
          git push origin HEAD:feature/hybrid-query-interpretation
