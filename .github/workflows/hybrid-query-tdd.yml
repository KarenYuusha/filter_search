name: Hybrid query TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-query-interpretation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Apply Task 2 service integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('toram_search/service.py')
          text = path.read_text(encoding='utf-8')
          import_line = 'from toram_search.reconstruction import try_reconstruct_simple_search\n'
          if import_line not in text:
              needle = 'from toram_search.fallback import SearchIntentRequest\n'
              if needle not in text:
                  raise SystemExit('fallback import insertion point not found')
              text = text.replace(needle, needle + import_line, 1)

          block = '''        reconstruction = try_reconstruct_simple_search(\n            query,\n            available_stats=self.repository.list_stat_names(),\n            available_item_types=self.repository.list_item_types(),\n        )\n        if reconstruction.kind in {"success", "ambiguous"} and reconstruction.canonical_query:\n            reconstructed_route = core.route_deterministically(\n                reconstruction.canonical_query,\n                self.repository,\n                self.all_items,\n                self.help_service,\n                self.database_service,\n            )\n            if reconstructed_route.kind == "search" and reconstructed_route.parsed is not None:\n                return ServiceOutcome(\n                    "search",\n                    payload=self._materialize(reconstructed_route.parsed, {}),\n                )\n\n'''
          marker = '        if route.record_failure:\n            context.record_failure(query)\n'
          if block not in text:
              if marker not in text:
                  raise SystemExit('failed-query insertion point not found')
              text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Reconstruction focused gate
        run: python -m unittest tests.test_query_reconstruction -v
      - name: Service and parser regressions
        run: |
          python -m unittest \
            tests.test_search_service \
            tests.test_direct_structured_intent \
            tests.test_natural_give_ranking -v
      - name: Discord regressions
        run: python -m unittest tests.test_discord_bot -v
      - name: Full suite against known main baseline
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          status=$?
          set -e
          cat /tmp/full-suite.txt
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'test_rejected_payload_is_logged_with_reason' /tmp/full-suite.txt
          grep -q 'FAILED (failures=1)' /tmp/full-suite.txt
      - name: Commit Task 2 service integration
        shell: bash
        run: |
          git add toram_search/service.py
          if git diff --cached --quiet; then
            echo 'Task 2 service integration already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: route reconstructed queries before qwen'
          git push origin HEAD:feature/hybrid-query-interpretation
