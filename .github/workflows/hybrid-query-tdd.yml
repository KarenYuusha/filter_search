name: Hybrid query TDD

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hybrid-query-interpretation]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-query-interpretation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Apply Task 1 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('toram_data/stat_query.py')
          text = path.read_text(encoding='utf-8')
          if 'class ItemFilterPhrase:' not in text:
              needle = '''@dataclass(frozen=True)\nclass ItemTypeFilter:\n    label: str\n    item_types: tuple[str, ...]\n    consumed_text: str\n'''
              replacement = needle + '''\n\n@dataclass(frozen=True)\nclass ItemFilterPhrase:\n    phrase: str\n    label: str\n    item_types: tuple[str, ...]\n'''
              if needle not in text:
                  raise SystemExit('ItemTypeFilter insertion point not found')
              text = text.replace(needle, replacement, 1)

          if 'def list_item_filter_phrases(' not in text:
              needle = '\n\ndef _extract_trailing_filter(\n'
              addition = '''\n\ndef list_item_filter_phrases(\n    available_item_types: set[str],\n) -> tuple[ItemFilterPhrase, ...]:\n    output: list[ItemFilterPhrase] = []\n    seen: set[ItemFilterPhrase] = set()\n    for phrase, label, configured_types in _filter_candidates():\n        item_types = _existing_types(configured_types, available_item_types)\n        if not item_types:\n            continue\n        row = ItemFilterPhrase(phrase, label, item_types)\n        if row in seen:\n            continue\n        seen.add(row)\n        output.append(row)\n    return tuple(output)\n'''
              if needle not in text:
                  raise SystemExit('filter catalog insertion point not found')
              text = text.replace(needle, addition + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > toram_search/reconstruction.py <<'PY'
          from __future__ import annotations

          import re
          from collections import Counter
          from dataclasses import dataclass
          from typing import Iterable, Literal

          from toram_data.aliases import (
              ITEM_WORD_ALIASES,
              StatTermResolution,
              normalize_stat_text,
              preferred_stat_alias,
              resolve_stat_term,
          )
          from toram_data.stat_query import ItemFilterPhrase, list_item_filter_phrases


          ReconstructionKind = Literal["success", "ambiguous", "no_match", "unsafe"]

          _FILLERS = frozenset(
              {
                  "a",
                  "an",
                  "can",
                  "find",
                  "give",
                  "gives",
                  "has",
                  "have",
                  "having",
                  "i",
                  "me",
                  "show",
                  "some",
                  "that",
                  "the",
                  "want",
                  "which",
                  "with",
                  "you",
              }
          )
          _RANK_WORDS = frozenset({"highest", "best", "most"})
          _COMPLEX_RE = re.compile(r"(>=|<=|==|>|<|=)|\b(?:and|or)\b", re.IGNORECASE)


          @dataclass(frozen=True)
          class ReconstructionResult:
              kind: ReconstructionKind
              canonical_query: str | None = None
              stat_resolution: StatTermResolution | None = None
              filter_phrase: ItemFilterPhrase | None = None


          def _tokens(raw_query: str) -> list[str]:
              return [
                  ITEM_WORD_ALIASES.get(token, token)
                  for token in normalize_stat_text(raw_query).split()
              ]


          def _semantic_filter_key(row: ItemFilterPhrase) -> tuple[str, tuple[str, ...]]:
              return row.label, row.item_types


          def _is_counter_subset(required: Counter[str], available: Counter[str]) -> bool:
              return all(available[token] >= count for token, count in required.items())


          def _remove_token_counts(tokens: list[str], counts: Counter[str]) -> list[str]:
              remaining = counts.copy()
              output: list[str] = []
              for token in tokens:
                  if remaining[token] > 0:
                      remaining[token] -= 1
                  else:
                      output.append(token)
              return output


          def _preferred_filter_phrase(
              matched: ItemFilterPhrase,
              catalog: tuple[ItemFilterPhrase, ...],
          ) -> str:
              key = _semantic_filter_key(matched)
              phrases = [row.phrase for row in catalog if _semantic_filter_key(row) == key]
              return min(
                  phrases,
                  key=lambda value: (len(value.split()), len(value), value.casefold()),
              )


          def _recognize(
              raw_query: str,
              *,
              available_stats: Iterable[str],
              available_item_types: set[str],
              allow_one_rank_word: bool,
          ) -> ReconstructionResult:
              if _COMPLEX_RE.search(raw_query):
                  return ReconstructionResult("unsafe")

              tokens = _tokens(raw_query)
              rank_count = sum(token in _RANK_WORDS for token in tokens)
              if allow_one_rank_word:
                  if rank_count > 1:
                      return ReconstructionResult("unsafe")
                  if rank_count == 1:
                      removed = False
                      cleaned: list[str] = []
                      for token in tokens:
                          if token in _RANK_WORDS and not removed:
                              removed = True
                              continue
                          cleaned.append(token)
                      tokens = cleaned
              elif rank_count:
                  return ReconstructionResult("unsafe")

              catalog = list_item_filter_phrases(available_item_types)
              available_counter = Counter(tokens)
              eligible: list[tuple[ItemFilterPhrase, Counter[str]]] = []
              for row in catalog:
                  phrase_counter = Counter(row.phrase.split())
                  if phrase_counter and _is_counter_subset(phrase_counter, available_counter):
                      eligible.append((row, phrase_counter))
              if not eligible:
                  return ReconstructionResult("no_match")

              max_tokens = max(sum(counter.values()) for _row, counter in eligible)
              largest = [
                  (row, counter)
                  for row, counter in eligible
                  if sum(counter.values()) == max_tokens
              ]
              semantic_keys = {_semantic_filter_key(row) for row, _counter in largest}
              if len(semantic_keys) != 1:
                  return ReconstructionResult("unsafe")

              matched, matched_counter = min(
                  largest,
                  key=lambda pair: (len(pair[0].phrase), pair[0].phrase.casefold()),
              )
              remaining = _remove_token_counts(tokens, matched_counter)
              stat_tokens = [token for token in remaining if token not in _FILLERS]
              if not stat_tokens:
                  return ReconstructionResult("unsafe", filter_phrase=matched)

              stat_text = " ".join(stat_tokens)
              resolution = resolve_stat_term(
                  stat_text,
                  available_stats,
                  allow_fuzzy=False,
              )
              if resolution.status not in {"exact", "alias", "ambiguous"}:
                  return ReconstructionResult(
                      "unsafe",
                      stat_resolution=resolution,
                      filter_phrase=matched,
                  )

              normalized_stat = normalize_stat_text(stat_text)
              if resolution.status in {"alias", "ambiguous"}:
                  rendered_stat = normalized_stat
              else:
                  rendered_stat = preferred_stat_alias(resolution.candidates[0]) or normalized_stat
              canonical_query = f"{rendered_stat} {_preferred_filter_phrase(matched, catalog)}"
              return ReconstructionResult(
                  "ambiguous" if resolution.status == "ambiguous" else "success",
                  canonical_query=canonical_query,
                  stat_resolution=resolution,
                  filter_phrase=matched,
              )


          def try_reconstruct_simple_search(
              raw_query: str,
              *,
              available_stats: Iterable[str],
              available_item_types: set[str],
          ) -> ReconstructionResult:
              return _recognize(
                  raw_query,
                  available_stats=available_stats,
                  available_item_types=available_item_types,
                  allow_one_rank_word=False,
              )


          def try_suggest_query(
              raw_query: str,
              *,
              available_stats: Iterable[str],
              available_item_types: set[str],
          ) -> str | None:
              result = _recognize(
                  raw_query,
                  available_stats=available_stats,
                  available_item_types=available_item_types,
                  allow_one_rank_word=True,
              )
              if result.kind != "success":
                  return None
              return result.canonical_query
          PY
      - name: Reconstruction focused gate
        run: python -m unittest tests.test_query_reconstruction -v
      - name: Service and parser regressions
        run: |
          python -m unittest \
            tests.test_search_service \
            tests.test_direct_structured_intent \
            tests.test_natural_give_ranking -v
      - name: Discord regressions
        run: python -m unittest tests.test_discord_bot -v
      - name: Full suite against known main baseline
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          status=$?
          set -e
          cat /tmp/full-suite.txt
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -q 'test_rejected_payload_is_logged_with_reason' /tmp/full-suite.txt
          grep -q 'FAILED (failures=1)' /tmp/full-suite.txt
      - name: Commit Task 1 implementation
        shell: bash
        run: |
          git add toram_data/stat_query.py toram_search/reconstruction.py
          if git diff --cached --quiet; then
            echo 'Task 1 implementation already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add deterministic query reconstruction'
          git push origin HEAD:feature/hybrid-query-interpretation
