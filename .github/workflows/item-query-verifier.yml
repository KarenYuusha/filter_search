name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 898848227317cc80e389e468632a5496bc4ea25b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Verify Task 6 safety invariants
        run: python -m unittest tests.test_item_query_safety -v
