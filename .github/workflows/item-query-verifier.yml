name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/item-query-understanding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact reviewed head
        run: test "$(git rev-parse HEAD)" = "1cf705cf4844515fa808d6628d890270b1f151ef"
      - name: Remove private reconstruction coupling
        run: |
          python - <<'PY'
          from pathlib import Path

          entities = Path("toram_search/item_query_entities.py")
          text = entities.read_text(encoding="utf-8")
          old = '''FilterMatchStatus = Literal["unique", "none", "ambiguous"]
          FilterMatchKind = Literal["exact", "fuzzy"]

          _FILTER_FUZZY_BOUNDARIES = frozenset(
          '''
          new = '''FilterMatchStatus = Literal["unique", "none", "ambiguous"]
          FilterMatchKind = Literal["exact", "fuzzy"]

          ITEM_QUERY_FILLERS = frozenset(
          '''
          if text.count(old) != 1:
              raise SystemExit("entity filler declaration target changed")
          text = text.replace(old, new, 1)
          marker = '''    }
          )


          @dataclass(frozen=True)
          class QueryToken:
          '''
          replacement = '''    }
          )
          _FILTER_FUZZY_BOUNDARIES = ITEM_QUERY_FILLERS


          @dataclass(frozen=True)
          class QueryToken:
          '''
          if text.count(marker) != 1:
              raise SystemExit("entity filler closing target changed")
          entities.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          reconstruction = Path("toram_search/reconstruction.py")
          text = reconstruction.read_text(encoding="utf-8")
          old_import = '''from toram_search.item_query_entities import (
              find_exact_item_filter_matches,
              remaining_tokens,
              tokenize_item_query,
          )
          '''
          new_import = '''from toram_search.item_query_entities import (
              ITEM_QUERY_FILLERS,
              find_exact_item_filter_matches,
              remaining_tokens,
              tokenize_item_query,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit("reconstruction import target changed")
          text = text.replace(old_import, new_import, 1)
          filler_block = '''_FILLERS = frozenset(
              {
                  "a",
                  "an",
                  "can",
                  "find",
                  "give",
                  "gives",
                  "has",
                  "have",
                  "having",
                  "i",
                  "me",
                  "show",
                  "some",
                  "that",
                  "the",
                  "want",
                  "which",
                  "with",
                  "you",
              }
          )
          '''
          if text.count(filler_block) != 1:
              raise SystemExit("reconstruction filler block changed")
          text = text.replace(filler_block, "", 1)
          text = text.replace("token.normalized not in _FILLERS", "token.normalized not in ITEM_QUERY_FILLERS")
          reconstruction.write_text(text, encoding="utf-8")

          understanding = Path("toram_search/understanding.py")
          text = understanding.read_text(encoding="utf-8")
          old_import = '''from toram_search.item_query_entities import (
              ItemFilterMatch,
              QueryToken,
          '''
          new_import = '''from toram_search.item_query_entities import (
              ITEM_QUERY_FILLERS,
              ItemFilterMatch,
              QueryToken,
          '''
          if text.count(old_import) != 1:
              raise SystemExit("understanding entity import target changed")
          text = text.replace(old_import, new_import, 1)
          private_import = "from toram_search.reconstruction import _FILLERS\n"
          if text.count(private_import) != 1:
              raise SystemExit("understanding private import target changed")
          text = text.replace(private_import, "", 1)
          text = text.replace("token.normalized not in _FILLERS", "token.normalized not in ITEM_QUERY_FILLERS")
          understanding.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Verify shared-filler refactor
        run: |
          python -m unittest \
            tests.test_item_query_entities \
            tests.test_item_query_understanding \
            tests.test_query_reconstruction \
            tests.test_item_query_safety \
            -v
          python -m py_compile toram_search/item_query_entities.py toram_search/reconstruction.py toram_search/understanding.py
      - name: Commit reviewed refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_search/item_query_entities.py toram_search/reconstruction.py toram_search/understanding.py
          git diff --cached --check
          git commit -m "refactor: share item query filler vocabulary"
          git push origin HEAD:feature/item-query-understanding
