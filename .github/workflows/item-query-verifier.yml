name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a05566777a42a7ce43ae7c88fb0293743dbc099
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Task 2 RED
        run: python -m unittest tests.test_item_query_understanding -v
