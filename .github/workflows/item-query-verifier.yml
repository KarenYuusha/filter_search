name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c9823ba5da668219afed0b95df0d1f329ae0b75
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Task 3 RED
        run: python -m unittest tests.test_item_query_entities tests.test_item_query_understanding -v
