name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4dc98bbdf7e2f989a42a937363bf38b16a579210
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Task 6 fuzzy precedence RED
        run: python -m unittest tests.test_item_query_entities.ItemQueryEntityTests.test_fuzzy_same_semantic_filter_never_overrides_exact_match -v
