name: Item query verifier

on:
  pull_request:
    branches: [feature/item-query-understanding]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfcd4e30cd20669c8c2e936c04eabc5306891e80
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip rapidfuzz discord.py python-dotenv ollama
      - name: Task 1 GREEN
        run: python -m unittest tests.test_item_query_entities tests.test_query_reconstruction -v
