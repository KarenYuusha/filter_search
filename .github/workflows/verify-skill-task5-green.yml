name: Verify Skill Task 5 GREEN
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - run: python -m compileall -q toram_skills tests
      - run: python -m unittest tests.test_skill_repository tests.test_skill_importer -v
      - run: python -m unittest discover -s tests -v
