name: Core modularization Task 2 RED
on:
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-search-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Verify canonical item-filter module is missing
        run: |
          python - <<'PY'
          from toram_data.item_filters import extract_item_filter
          item_filter, remaining = extract_item_filter(
              "consume dte",
              {"Usable", "Weapon Crysta", "Enhancer Crysta (Red)"},
          )
          assert item_filter is not None
          assert item_filter.label == "Usable"
          assert remaining == "dte"
          PY
