name: Verify Skill Bot Full Acceptance

on:
  push:
    branches:
      - feat/skill-bot-integration
    paths:
      - '.github/workflows/verify-skill-bot-full.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU embedding runtime and repository test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            rapidfuzz numpy ollama httpx discord.py python-dotenv \
            'transformers>=4.41,<5' 'sentence-transformers>=5,<6'
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
