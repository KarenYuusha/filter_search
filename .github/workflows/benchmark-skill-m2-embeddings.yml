name: Benchmark Skill M2 Embeddings

on:
  pull_request:
    branches:
      - feat/skill-hybrid-retrieval

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rapidfuzz python-dotenv ollama discord.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull fixed benchmark shortlist
        run: |
          ollama pull embeddinggemma:300m
          ollama pull qwen3-embedding:0.6b
          ollama pull nomic-embed-text:v1.5
          ollama list
      - name: Run semantic benchmark
        run: |
          python benchmark_skill_embeddings.py \
            --database coryn_data/database/skills.sqlite \
            --golden tests/fixtures/skill_retrieval_golden.json \
            --models embeddinggemma:300m qwen3-embedding:0.6b nomic-embed-text:v1.5 \
            --output /tmp/skill-embedding-benchmark.json
          cat /tmp/skill-embedding-benchmark.json
