name: Verify Game Style Task 3 GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin feature/game-style-item-presentation
          git checkout -B feature/game-style-item-presentation origin/feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Task 3 production changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('search_items.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for index, result in enumerate(current, start=1):\n        lines.append(\n            f"{index}. {result.item.name} — {result.item.item_type} — "\n            + format_stat_display(stat_name, result.primary.amount)\n        )\n        condition = _condition_label(result.primary)\n        if condition:\n            lines.append(f"   Condition: {condition}")\n        for alternative in result.alternatives:\n            alternative_value = format_stat_value(stat_name, alternative.amount, signed=True)\n            alternative_line = f"   Also: {alternative_value or stat_name}"\n            alternative_condition = _condition_label(alternative)\n            if alternative_condition:\n                alternative_line += f" — {alternative_condition}"\n            lines.append(alternative_line)\n'''
          new = '''    for index, result in enumerate(current, start=1):\n        primary_line = format_stat_display(stat_name, result.primary.amount)\n        condition = format_condition_display(result.primary)\n        if condition:\n            primary_line += f" [{condition}]"\n        lines.append(\n            f"{index}. {result.item.name} — {result.item.item_type} — "\n            + primary_line\n        )\n        for alternative in result.alternatives:\n            alternative_line = "   Also: " + format_stat_display(\n                stat_name, alternative.amount\n            )\n            alternative_condition = format_condition_display(alternative)\n            if alternative_condition:\n                alternative_line += f" [{alternative_condition}]"\n            lines.append(alternative_line)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal stat result block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('discord_bot.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if isinstance(payload, StatResultsPayload):\n        result = payload.results[index]\n        parsed = payload.parsed\n        stat_name = parsed.stat.stat_name if parsed.stat else result.primary.stat_name\n        lines = [\n            f"**{result.item.name}** — {result.item.item_type}",\n            core.format_stat_display(stat_name, result.primary.amount),\n        ]\n        condition = _condition_label(result.primary)\n        if condition:\n            lines.append(f"Condition: {condition}")\n        return lines\n'''
          new = '''    if isinstance(payload, StatResultsPayload):\n        result = payload.results[index]\n        parsed = payload.parsed\n        stat_name = parsed.stat.stat_name if parsed.stat else result.primary.stat_name\n        primary = core.format_stat_display(stat_name, result.primary.amount)\n        condition = core.format_condition_display(result.primary)\n        if condition:\n            primary += f" [{condition}]"\n        return [\n            f"**{result.item.name}** — {result.item.item_type}",\n            primary,\n        ]\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one discord stat result block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    stat_lines: list[str] = []\n    for stat in detail.stats:\n        line = core.format_stat_display(\n            stat.get("stat_name") or "Unknown stat",\n            stat.get("amount"),\n        )\n        condition = _condition_label(stat)\n        if condition:\n            line += f" [{condition}]"\n        stat_lines.append(line)\n    _safe_field(embed, "Stats", "\\n".join(stat_lines) if stat_lines else "None")\n'''
          new = '''    stat_lines: list[str] = []\n    for group in core.build_item_stat_groups(detail.stats):\n        if group.heading is not None:\n            if stat_lines:\n                stat_lines.append("")\n            stat_lines.append(f"**{group.heading}**")\n        stat_lines.extend(group.lines)\n    _safe_field(embed, "Stats", "\\n".join(stat_lines) if stat_lines else "None")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one discord item stats block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile
        run: python -m py_compile search_items.py discord_bot.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_game_style_stat_display \
            tests.test_action_speed_alias \
            tests.test_unavailable_stat_display \
            tests.test_discord_bot \
            tests.test_discord_source_display -v
      - name: Commit Task 3 production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py discord_bot.py
          git commit -m "feat: use game-style stat presentation in discord"
          git push origin HEAD:feature/game-style-item-presentation
