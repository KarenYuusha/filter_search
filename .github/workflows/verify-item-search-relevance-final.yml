name: Verify Item Search Relevance Final

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact relevance feature head
        run: |
          git fetch origin main fix/item-upgrade-search-relevance
          git checkout --detach 16a65efabb5d054533a2e6fc9d32ab28918a880b
          test "$(git rev-parse HEAD)" = "16a65efabb5d054533a2e6fc9d32ab28918a880b"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile search_items.py toram_search/service.py discord_bot.py
      - name: Verify feature scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'docs/superpowers/specs/2026-08-10-item-search-relevance-filter-design.md',
              'docs/superpowers/plans/2026-08-10-item-search-relevance-filter.md',
              'search_items.py',
              'tests/test_item_search_relevance.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          assert changed == expected, (changed, expected)
          PY
      - name: Focused regression gate
        run: |
          python -m unittest \
            tests.test_item_search_relevance \
            tests.test_search_service \
            tests.test_cli_upgrade \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot \
            tests.test_direct_structured_intent \
            tests.test_llm -v
      - name: Full-suite final measurement
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
