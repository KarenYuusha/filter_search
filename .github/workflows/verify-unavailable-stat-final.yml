name: Verify Unavailable Stat Final

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact feature head
        run: |
          git fetch origin main fix/unavailable-stat-display
          git checkout --detach b7a7ca9e417311fe2ee6a1858fa1e8f13165a679
          test "$(git rev-parse HEAD)" = "b7a7ca9e417311fe2ee6a1858fa1e8f13165a679"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile runtime modules
        run: python -m py_compile search_items.py discord_bot.py toram_search/service.py
      - name: Verify exact feature scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'search_items.py',
              'discord_bot.py',
              'tests/test_unavailable_stat_display.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          print('changed=', sorted(changed))
          assert changed == expected, (changed, expected)
          PY
      - name: Focused regression gate
        run: |
          python -m unittest \
            tests.test_unavailable_stat_display \
            tests.test_discord_bot \
            tests.test_discord_source_display \
            tests.test_search_service \
            tests.test_direct_structured_intent \
            tests.test_item_search_relevance \
            tests.test_cli_upgrade -v
      - name: Verify real database rendering
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          import discord_bot
          import search_items as core

          database = Path('coryn_data/database/items.sqlite')
          db = sqlite3.connect(database)
          db.row_factory = sqlite3.Row
          true_row = db.execute('''
              SELECT item_id FROM item_stats
              WHERE stat_name = 'Tumble Unavailable' AND amount = 1
              ORDER BY item_id LIMIT 1
          ''').fetchone()
          assert true_row is not None
          true_id = int(true_row['item_id'])
          false_row = db.execute('''
              SELECT item_id FROM item_stats
              WHERE stat_name = 'Tumble Unavailable' AND amount = 0
              ORDER BY item_id LIMIT 1
          ''').fetchone()
          assert false_row is not None
          false_id = int(false_row['item_id'])
          db.close()

          repo = core.ItemRepository(database)
          try:
              true_detail = repo.get_item(true_id)
              false_detail = repo.get_item(false_id)
          finally:
              repo.close()

          terminal_true = core.render_item(true_detail)
          discord_true = discord_bot.build_item_detail_embed(true_detail)
          discord_true_stats = next(field.value for field in discord_true.fields if field.name == 'Stats')
          print('true item:', true_id, true_detail.summary.name)
          print('terminal true stat lines:', [line for line in terminal_true.splitlines() if 'Tumble Unavailable' in line])
          print('discord true stats:', [line for line in discord_true_stats.splitlines() if 'Tumble Unavailable' in line])
          assert 'Tumble Unavailable +1' not in terminal_true
          assert 'Tumble Unavailable +1' not in discord_true_stats
          assert '- Tumble Unavailable' in terminal_true
          assert any(line == 'Tumble Unavailable' for line in discord_true_stats.splitlines())

          terminal_false = core.render_item(false_detail)
          discord_false = discord_bot.build_item_detail_embed(false_detail)
          discord_false_stats = next(field.value for field in discord_false.fields if field.name == 'Stats')
          print('zero item:', false_id, false_detail.summary.name)
          print('terminal zero stat lines:', [line for line in terminal_false.splitlines() if 'Tumble Unavailable' in line])
          print('discord zero stats:', [line for line in discord_false_stats.splitlines() if 'Tumble Unavailable' in line])
          assert 'Tumble Unavailable 0' in terminal_false
          assert 'Tumble Unavailable 0' in discord_false_stats

          synthetic = core.ItemDetail(
              summary=core.ItemSummary(999999, 'Numeric Control', 'Armor'),
              sell_price=None, process_material=None, process_amount=None,
              badge=None, note=None, page_url=None,
              stats=[{
                  'stat_name': 'STR', 'amount': 1,
                  'conditions_json': '[]', 'condition_text': None,
                  'coryn_applies_to': None, 'needs_condition_review': False,
              }],
              sources=[], images=[], upgrade_predecessors=[], upgrade_successors=[],
          )
          assert 'STR +1' in core.render_item(synthetic)
          synthetic_embed = discord_bot.build_item_detail_embed(synthetic)
          synthetic_stats = next(field.value for field in synthetic_embed.fields if field.name == 'Stats')
          assert 'STR +1' in synthetic_stats
          print('numeric control: STR +1 preserved')
          PY
      - name: Full-suite final measurement
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.log 2>&1
          status=$?
          cat /tmp/full-suite.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -q "FAILED (failures=1)" /tmp/full-suite.log || exit "$status"
          grep -q "test_rejected_payload_is_logged_with_reason" /tmp/full-suite.log || exit "$status"
          grep -q "missing or invalid search candidates" /tmp/full-suite.log || exit "$status"
          grep -q "search payload has unexpected fields" /tmp/full-suite.log || exit "$status"
          echo "Verified exact known baseline failure only."
