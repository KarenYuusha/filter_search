name: Verify Flag Stat Diagnostic

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect flag-like stat storage
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(Path('coryn_data/database/items.sqlite'))
          db.row_factory = sqlite3.Row
          print('=== unavailable stats ===')
          for row in db.execute('''
              SELECT stat_name, amount, COUNT(*) AS count
              FROM item_stats
              WHERE lower(stat_name) LIKE '% unavailable'
              GROUP BY stat_name, amount
              ORDER BY stat_name, amount
          '''):
              print(dict(row))
          print('=== anomalous unavailable rows ===')
          for row in db.execute('''
              SELECT s.item_id, i.name, i.item_type, s.stat_name, s.amount,
                     s.conditions_json, s.condition_text, s.needs_condition_review
              FROM item_stats AS s
              JOIN items AS i ON i.id = s.item_id
              WHERE lower(s.stat_name) LIKE '% unavailable'
                AND s.amount <> 1
              ORDER BY s.stat_name, s.item_id
          '''):
              print(dict(row))
          print('=== amount=1 numeric controls ===')
          for stat_name in ('STR', 'Critical Rate', 'ATK %'):
              row = db.execute('''
                  SELECT COUNT(*) AS count FROM item_stats
                  WHERE stat_name = ? AND amount = 1
              ''', (stat_name,)).fetchone()
              print(stat_name, int(row['count']))
          PY
