name: Verify Single Result Auto Open GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin feature/game-style-item-presentation
          git checkout -B feature/game-style-item-presentation origin/feature/game-style-item-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Task 4 production changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('toram_search/service.py')
          text = path.read_text(encoding='utf-8')

          old = '''            results = (\n                [core.RankedItem(item=item, score=100.0, match_kind="exact") for item in exact]\n                if len(exact) > 1\n                else core.rank_items(query, self.all_items)\n            )\n            return ItemResultsPayload(query, tuple(results))\n'''
          new = '''            results = (\n                [core.RankedItem(item=item, score=100.0, match_kind="exact") for item in exact]\n                if len(exact) > 1\n                else core.rank_items(query, self.all_items)\n            )\n            if len(results) == 1:\n                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n            return ItemResultsPayload(query, tuple(results))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one item search materialization block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            results = (\n                [core.RankedItem(item=item, score=100.0, match_kind="exact") for item in exact]\n                if len(exact) > 1\n                else core.rank_items(query, upgrade_items)\n            )\n            return UpgradeResultsPayload(query, tuple(results))\n'''
          new = '''            results = (\n                [core.RankedItem(item=item, score=100.0, match_kind="exact") for item in exact]\n                if len(exact) > 1\n                else core.rank_items(query, upgrade_items)\n            )\n            if len(results) == 1:\n                selected_id = results[0].item.id\n                return UpgradeDetailPayload(\n                    graph=self.repository.get_upgrade_component(selected_id),\n                    selected_item_id=selected_id,\n                )\n            return UpgradeResultsPayload(query, tuple(results))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one upgrade search materialization block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            results = self.repository.search_by_stat(\n                parsed.stat.stat_name,\n                parsed.filter.item_types if parsed.filter else None,\n            )\n            return StatResultsPayload(parsed, tuple(results))\n'''
          new = '''            results = self.repository.search_by_stat(\n                parsed.stat.stat_name,\n                parsed.filter.item_types if parsed.filter else None,\n            )\n            if len(results) == 1:\n                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n            return StatResultsPayload(parsed, tuple(results))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stat search materialization block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            results = self.repository.search_by_expression(\n                resolved.resolved_expression,\n                resolved.filter.item_types if resolved.filter else None,\n                primary_sort_ascending=resolved.primary_sort_ascending,\n            )\n            return ExpressionResultsPayload(resolved, tuple(results))\n'''
          new = '''            results = self.repository.search_by_expression(\n                resolved.resolved_expression,\n                resolved.filter.item_types if resolved.filter else None,\n                primary_sort_ascending=resolved.primary_sort_ascending,\n            )\n            if len(results) == 1:\n                return ItemDetailPayload(self.repository.get_item(results[0].item.id))\n            return ExpressionResultsPayload(resolved, tuple(results))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one expression materialization block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile
        run: python -m py_compile toram_search/service.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_single_result_auto_open.ServiceSingleResultAutoOpenTests \
            tests.test_search_service \
            tests.test_discord_followup_regressions \
            tests.test_discord_bot -v
      - name: Commit Task 4 production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toram_search/service.py
          git commit -m "feat: auto-open sole service search result"
          git push origin HEAD:feature/game-style-item-presentation
