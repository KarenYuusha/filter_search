name: Apply Discord Task 2

on:
  push:
    branches: [refactor/discord-modularization]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-discord-task2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/discord-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_discord_task2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add discord_bot.py toram_discord/render.py
          git commit -m 'refactor: extract Discord rendering'
          git push origin HEAD:refactor/discord-modularization
