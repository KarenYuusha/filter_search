name: Verify Unavailable Stat GREEN

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out feature branch
        run: |
          git fetch origin fix/unavailable-stat-display
          git checkout -B fix/unavailable-stat-display origin/fix/unavailable-stat-display
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared unavailable-stat formatter
        run: |
          python - <<'PY'
          from pathlib import Path

          search_path = Path('search_items.py')
          text = search_path.read_text(encoding='utf-8')

          marker = '''def _parse_conditions(raw: Any) -> list[str]:\n'''
          helper = '''_UNAVAILABLE_PRESENCE_STATS = frozenset({\n    "flinch unavailable",\n    "stun unavailable",\n    "tumble unavailable",\n})\n\n\ndef _is_unavailable_presence_value(stat_name: object, amount: object) -> bool:\n    name = normalize_stat_text(str(stat_name or ""))\n    if name not in _UNAVAILABLE_PRESENCE_STATS:\n        return False\n    try:\n        return float(amount) == 1.0\n    except (TypeError, ValueError):\n        return False\n\n\ndef format_stat_value(stat_name: object, amount: object, *, signed: bool = True) -> str:\n    if _is_unavailable_presence_value(stat_name, amount):\n        return ""\n    return _format_number(amount, signed=signed)\n\n\ndef format_stat_display(stat_name: object, amount: object) -> str:\n    name = str(stat_name or "Unknown stat")\n    value = format_stat_value(name, amount, signed=True)\n    return name if not value else f"{name} {value}"\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one parse-conditions marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          old = '''            rendered = f"- {stat.get('stat_name') or 'Unknown stat'} {_format_number(stat.get('amount'), signed=True)}"\n'''
          new = '''            rendered = "- " + format_stat_display(\n                stat.get("stat_name") or "Unknown stat",\n                stat.get("amount"),\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal detail stat renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        lines.append(\n            f"{index}. {result.item.name} — {result.item.item_type} — "\n            f"{stat_name} {_format_number(result.primary.amount, signed=True)}"\n        )\n'''
          new = '''        lines.append(\n            f"{index}. {result.item.name} — {result.item.item_type} — "\n            + format_stat_display(stat_name, result.primary.amount)\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal stat-results renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            alternative_line = f"   Also: {_format_number(alternative.amount, signed=True)}"\n'''
          new = '''            alternative_value = format_stat_value(stat_name, alternative.amount, signed=True)\n            alternative_line = f"   Also: {alternative_value or stat_name}"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal stat alternative renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                rendered = f"{match.clause.stat_name} {_format_number(row.amount, signed=True)}"\n'''
          new = '''                rendered = format_stat_display(match.clause.stat_name, row.amount)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one terminal expression renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)
          search_path.write_text(text, encoding='utf-8')

          discord_path = Path('discord_bot.py')
          text = discord_path.read_text(encoding='utf-8')

          old = '''            f"{stat_name} {_format_number(result.primary.amount, signed=True)}",\n'''
          new = '''            core.format_stat_display(stat_name, result.primary.amount),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Discord stat-results renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                text = (\n                    f"{prefix}{match.clause.stat_name} "\n                    f"{_format_number(row.amount, signed=True)}"\n                )\n'''
          new = '''                text = prefix + core.format_stat_display(\n                    match.clause.stat_name,\n                    row.amount,\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Discord expression renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        line = (\n            f"{stat.get('stat_name') or 'Unknown stat'} "\n            f"{_format_number(stat.get('amount'), signed=True)}"\n        )\n'''
          new = '''        line = core.format_stat_display(\n            stat.get("stat_name") or "Unknown stat",\n            stat.get("amount"),\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Discord detail stat renderer, found {text.count(old)}')
          text = text.replace(old, new, 1)
          discord_path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install 'rapidfuzz>=3.14.5' 'ollama>=0.6.2' 'discord.py>=2.7.1,<3' 'python-dotenv>=1.1,<2'
      - name: Compile
        run: python -m py_compile search_items.py discord_bot.py toram_search/service.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_unavailable_stat_display \
            tests.test_discord_bot \
            tests.test_discord_source_display \
            tests.test_search_service \
            tests.test_cli_upgrade -v
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search_items.py discord_bot.py
          git commit -m "fix: render unavailable stats as presence flags"
          git push origin HEAD:fix/unavailable-stat-display
