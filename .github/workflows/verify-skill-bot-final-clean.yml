name: Verify Skill Bot Final Clean Head

on:
  push:
    branches:
      - verify/skill-bot-final-acceptance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 089e7b3f633f8920bca532ba89cf78212472cc8b
      - name: Verify exact feature commit
        run: test "$(git rev-parse HEAD)" = "089e7b3f633f8920bca532ba89cf78212472cc8b"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            rapidfuzz numpy ollama httpx discord.py python-dotenv \
            'transformers>=4.41,<5' 'sentence-transformers>=5,<6'
      - name: Run focused integration and review regressions
        run: |
          python -m unittest \
            tests.test_skill_search_service \
            tests.test_skill_hybrid_search \
            tests.test_skill_bot_config \
            tests.test_discord_skill_search \
            tests.test_discord_skill_review_regressions \
            tests.test_discord_bot \
            tests.test_discord_followup_regressions \
            tests.test_discord_module_boundaries \
            tests.test_core_module_boundaries -v
      - name: Verify selected MiniLM runtime against canonical index
        run: |
          python - <<'PY'
          from pathlib import Path
          from toram_skill_search.runtime import SemanticRuntimeCache
          from toram_skills.hybrid_search import HybridSkillSearcher
          from toram_skills.repository import SkillRepository
          from toram_skills.retrieval_config import DEFAULT_FUSION_CONFIG

          path = Path('coryn_data/database/skills.sqlite')
          with SkillRepository(path) as repo:
              index = SemanticRuntimeCache().get_index(repo)
              if index is None:
                  raise SystemExit('Selected MiniLM semantic runtime did not initialize')
              hits = HybridSkillSearcher(
                  repo,
                  semantic_index=index,
                  fusion_config=DEFAULT_FUSION_CONFIG,
              ).search('attack while moving', limit=5)
              print([hit.skill_id for hit in hits])
              if not hits:
                  raise SystemExit('Real semantic/hybrid smoke returned no hits')
          PY
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
